apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: baseline-pod-rules
spec:
  validationFailureAction: Audit      # change to Enforce after fixing violations
  background: true
  rules:
    - name: disallow-latest-tag
      match:
        any:
          - resources: { kinds: ["Pod"], namespaces: ["app-*"] }
      validate:
        message: "Use a pinned image tag, not :latest."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
    - name: require-run-as-non-root
      match:
        any:
          - resources: { kinds: ["Pod"], namespaces: ["app-*"] }
      validate:
        message: "Pods must run as non-root."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
    - name: require-requests-limits
      match:
        any:
          - resources: { kinds: ["Pod"], namespaces: ["app-*"] }
      validate:
        message: "CPU/memory requests and limits are required."
        pattern:
          spec:
            containers:
              - resources:
                  requests: { cpu: "?*", memory: "?*" }
                  limits:   { memory: "?*" }
