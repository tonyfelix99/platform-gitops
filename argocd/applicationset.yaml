apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: webapp
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
          - env: staging
          - env: prod
  template:
    metadata:
      name: "webapp-{{env}}"
    spec:
      project: apps
      source:
        repoURL: https://github.com/YOUR_ORG/platform-gitops.git    # REPO_URL
        targetRevision: main
        path: charts/webapp
        helm:
          releaseName: webapp
          valueFiles:
            - "../../envs/{{env}}/values.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: "app-{{env}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
